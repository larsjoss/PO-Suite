name: Deploy PO Suite

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
  workflow_dispatch:
    inputs:
      build_docker:
        description: 'Docker-Images bauen und zu GHCR pushen'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write   # required for GHCR push

# ─── Job 1: Test ─────────────────────────────────────────────────────────────
# Runs on every push to main (frontend/** or backend/**).
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Frontend tests
        working-directory: frontend
        run: npm run test:run

      - name: Backend TypeScript check
        working-directory: backend
        run: |
          npm ci
          npx tsc --noEmit

# ─── Job 2: Deploy GitHub Pages ───────────────────────────────────────────────
# Runs only on push to main (frontend/** changed) after tests pass.
  deploy-gh-pages:
    name: Deploy GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (GitHub Pages)
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_AUTH_EMAIL: ${{ secrets.VITE_AUTH_EMAIL }}
          VITE_AUTH_PASSWORD: ${{ secrets.VITE_AUTH_PASSWORD }}

      - name: Copy index.html → 404.html for SPA routing
        run: cp frontend/dist/index.html frontend/dist/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist

# ─── Job 3: Build & Push Docker Images ───────────────────────────────────────
# Runs ONLY on manual workflow_dispatch with build_docker=true.
# Requires secrets: REGISTRY_URL (optional, defaults to ghcr.io),
#   REGISTRY_USERNAME, REGISTRY_PASSWORD, OC_SERVER, OC_TOKEN (optional).
  build-and-push:
    name: Build & Push Images
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_docker == 'true'

    env:
      REGISTRY: ${{ secrets.REGISTRY_URL || 'ghcr.io' }}
      IMAGE_BACKEND: ${{ secrets.REGISTRY_URL || 'ghcr.io' }}/${{ github.repository_owner }}/posuite-backend
      IMAGE_FRONTEND: ${{ secrets.REGISTRY_URL || 'ghcr.io' }}/${{ github.repository_owner }}/posuite-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
            ${{ env.IMAGE_BACKEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image (enterprise)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile.production
          push: true
          build-args: |
            VITE_TARGET=enterprise
            VITE_API_URL=${{ secrets.VITE_API_URL || 'https://posuite-api.apps.cluster.example.com' }}
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
            ${{ env.IMAGE_FRONTEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Optional: trigger OpenShift rollout via oc CLI.
      # Requires secrets: OC_SERVER, OC_TOKEN, OC_NAMESPACE.
      # Remove this step if you use ArgoCD or another GitOps tool instead.
      - name: Rollout on OpenShift
        if: ${{ secrets.OC_SERVER != '' }}
        run: |
          curl -LO "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz"
          tar xzf openshift-client-linux.tar.gz oc
          ./oc login "${{ secrets.OC_SERVER }}" --token="${{ secrets.OC_TOKEN }}" --insecure-skip-tls-verify=false

          NS="${{ secrets.OC_NAMESPACE }}"
          SHA="${{ github.sha }}"

          ./oc set image deployment/posuite-backend \
            "backend=${{ env.IMAGE_BACKEND }}:${SHA}" -n "${NS}"
          ./oc set image deployment/posuite-frontend \
            "frontend=${{ env.IMAGE_FRONTEND }}:${SHA}" -n "${NS}"

          ./oc rollout status deployment/posuite-backend -n "${NS}" --timeout=3m
          ./oc rollout status deployment/posuite-frontend -n "${NS}" --timeout=3m
