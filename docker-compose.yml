services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: posuite
      POSTGRES_USER: posuite
      POSTGRES_PASSWORD: posuite
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posuite"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://posuite:posuite@db:5432/posuite
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && node dist/src/server.js"

  # Run with: docker compose --profile frontend up
  frontend:
    profiles: ["frontend"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
      args:
        VITE_TARGET: enterprise
        VITE_API_URL: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  db_data:
