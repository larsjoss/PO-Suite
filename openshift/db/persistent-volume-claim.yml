apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: posuite-db-data
  labels:
    app: posuite
    component: db
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # Remove storageClassName to use the cluster default, or specify one:
  # storageClassName: gp3-csi
