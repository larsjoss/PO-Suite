apiVersion: apps/v1
kind: Deployment
metadata:
  name: posuite-frontend
  labels:
    app: posuite
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: posuite
      component: frontend
  template:
    metadata:
      labels:
        app: posuite
        component: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/larsjoss/posuite-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
